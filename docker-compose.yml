# GigPilot local dev stack (04_TRD §9: local dev runs pgvector + redis + backend + worker + beat).
# Hosted demo swaps DATABASE_URL/REDIS_URL to Supabase/Upstash; the topology is identical.
# Requires a local .env (copy .env.example). Backend image build (Dockerfile) arrives in P5-2;
# `docker compose config` validates this file without building.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gigpilot
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gigpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigpilot -d gigpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://gigpilot:password@db:5432/gigpilot
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://gigpilot:password@db:5432/gigpilot
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://gigpilot:password@db:5432/gigpilot
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
